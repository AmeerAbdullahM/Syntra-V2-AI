[project]
name = "syntra_v2"
version = "0.1.0"
description = "Syntra V2 - Multimodal lecture reconstruction"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
